name: Apexis CI/CD Pipeline

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  # ── 1. Web Tier (Next.js 16 + React 19 + TypeScript + Vitest) ──
  web-ci:
    name: Next.js 16 Web Tier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Static Typecheck & Lint
        run: |
          npx tsc --noEmit
          npm run lint
          
      - name: Run Vitest Suite (47 Tests)
        run: npm test
        
      - name: Production Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: "https://placeholder.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "placeholder"
          NEXT_TELEMETRY_DISABLED: 1

  # ── 2. Systems Core Tier (C++20 Ingestion Engine & Anomaly Processors) ──
  core-ci:
    name: C++20 Core & Microbenchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Modern GCC (C++20 Support)
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-13 build-essential
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-13 100

      - name: Compile apexis-core & spsc_bench
        run: |
          cd services/apexis-core
          make
          ls -la bin/

      - name: Execute Lock-Free SPSC Microbenchmark Suite
        run: |
          ./services/apexis-core/bin/spsc_bench

      - name: Compile apexis-sim (500Hz Load Generator)
        run: |
          cd services/apexis-sim
          make
          ls -la bin/

  # ── 3. High-Concurrency Gateway Tier (Go 1.23 gRPC & WebSocket Fan-out) ──
  gateway-ci:
    name: Go 1.23 Telemetry Gateway
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go 1.23
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: services/apexis-gateway/go.sum

      - name: Validate Dependencies & Format
        run: |
          cd services/apexis-gateway
          go mod tidy
          git diff --exit-code go.mod go.sum || true

      - name: Build apexis-gateway Executable
        run: |
          cd services/apexis-gateway
          go build -v -o bin/apexis-gateway ./cmd/gateway
          ls -la bin/
