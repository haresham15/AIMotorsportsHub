global:
  scrape_interval: 1s
  evaluation_interval: 1s

scrape_configs:
  - job_name: 'apexis-core'
    static_configs:
      - targets: ['apexis-core:9091', 'host.docker.internal:9091', '127.0.0.1:9091']
    metrics_path: /metrics

  - job_name: 'apexis-gateway'
    static_configs:
      - targets: ['apexis-gateway:9092', 'host.docker.internal:9092', '127.0.0.1:9092']
    metrics_path: /metrics
